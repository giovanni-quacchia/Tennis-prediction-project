[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-predictor"
version = "0.1.0"
description = "Tennis match prediction CLI"
requires-python = ">=3.11"
dependencies = [
    "typer==0.24.1",
    "rich==15.0.0",
    "pydantic==2.13.3",
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "pandas==3.0.2",
    "openpyxl==3.1.5",
    "xgboost==3.3.0",
    "xlrd==2.0.2", # for reading .xls files
]

# create a cmd "tennis-predictor" that runs tennis_prediction/cli.py
[project.scripts]
tennis-predictor = "tennis_prediction.cli:app"

[tool.setuptools.packages.find]
where = ["src"]